[package]
name = "paperwhirl-shell"
version = "0.1.3"
description = "PaperWhirl desktop app shell"
authors = ["Rob Mitra"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.1", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.1", features = [] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
# Stage 6 E7 follow-up (2026-05-27): open external URLs in the
# user's default browser as a fallback when PMC reCAPTCHA blocks
# in-app download of OA papers.
tauri-plugin-shell = "2"
# Stage 6 E1: sidecar spawn + health poll. Only used in release
# builds, but the deps compile in dev too. rustls-tls keeps us
# off the system OpenSSL.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
dirs = "5"
tokio = { version = "1", features = ["time"] }
